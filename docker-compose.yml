name: watch-pipeline

services:
    pipeline:
        build: .
        image: watch-pipeline:latest
        restart: "no"

        # Modern Compose (v2.20+): the deploy stanza auto-translates to --gpus on
        # the underlying `docker run`. Replace with `runtime: nvidia` for older
        # Compose (<2.20) if the deploy stanza is rejected as unknown.
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu, compute, utility]
        # runtime: nvidia

        environment:
            # All model weights are pre-baked into the image at build time.
            NVIDIA_VISIBLE_DEVICES: all
            NVIDIA_DRIVER_CAPABILITIES: compute,utility
            WATCH_INPUT_DIR: /data/in
            WATCH_OUTPUT_DIR: /data/out
            # Reduces CUDA memory fragmentation -- prevents OOM on long batches.
            PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

        volumes:
            # Project root as input (read-only), results land in ./output.
            - ./:/data/in:ro
            - ./output:/data/out
            # The Shopify CLI session written on the host, read-only. The container
            # reads the admin API token from it and never writes to it.
            - ${SHOPIFY_CLI_CONFIG_DIR:-${HOME}/.config/shopify-cli-store-nodejs}:/data/shopify-cli:ro
